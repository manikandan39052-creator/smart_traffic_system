<!doctype html><html><head><meta charset="utf-8"><title>Traffic Enforcement Review</title><style>body{font-family:system-ui;background:#0f172a;color:#e2e8f0;margin:2rem}table{width:100%;border-collapse:collapse;background:#1e293b}th,td{padding:.8rem;text-align:left;border-bottom:1px solid #334155}button{background:#2563eb;color:white;border:0;padding:.45rem .7rem;border-radius:4px}.card{display:inline-block;background:#1e293b;padding:1rem;margin-right:1rem;border-radius:8px}</style></head><body><h1>Traffic Enforcement Review</h1><div id="stats"></div><h2>Violations</h2><table><thead><tr><th>Plate</th><th>Type</th><th>Camera</th><th>Time</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table><script>async function load(){let [v,s]=await Promise.all([fetch('/api/violations').then(r=>r.json()),fetch('/api/statistics').then(r=>r.json())]);stats.innerHTML=`<div class=card>Total: ${s.total||0}</div><div class=card>Pending: ${s.pending||0}</div><div class=card>Confirmed: ${s.confirmed||0}</div>`;rows.innerHTML=v.map(x=>`<tr><td>${x.plate_number||'Pending OCR'}</td><td>${x.violation_type}</td><td>${x.camera_id}</td><td>${x.timestamp}</td><td>${x.status}</td><td><button onclick="review('${x.id}','confirm')">Confirm</button> <button onclick="review('${x.id}','reject')">Reject</button></td></tr>`).join('')}async function review(id,action){await fetch('/api/violations/'+id+'/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});load()}load();new WebSocket(`ws://${location.host}/ws/events`).onmessage=load;</script></body></html>
